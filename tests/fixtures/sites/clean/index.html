<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean page</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #ffffff; margin: 0; }
  main { max-width: 40rem; margin: 0 auto; padding: 1rem; }
  input, button { font: inherit; min-height: 32px; }
  button { min-width: 44px; }
</style>
</head>
<body>
<main id="main">
  <h1>Clean page</h1>
  <p>An accessible page with a language, a title, labelled controls and text alternatives.</p>
  <img src="logo.svg" alt="Clean page logo: a blue circle" width="48" height="48">
  <form action="/subscribe">
    <label for="email">Email</label>
    <input id="email" type="email" name="email">
    <button type="submit">Subscribe</button>
  </form>
</main>
</body>
</html>
